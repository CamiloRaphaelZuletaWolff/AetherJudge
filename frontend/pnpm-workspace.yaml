allowBuilds:
  # sharp powers next/image optimization; unrs-resolver backs eslint-config-next.
  # Both need their native postinstall builds.
  sharp: true
  unrs-resolver: true

# Pin ESLint tree-wide. eslint-config-next 15.5.x patches ESLint via
# @rushstack/eslint-patch, which breaks on ESLint 10 ("calling module was not
# recognized"). The override guarantees no transitive resolution can pull v10
# regardless of cache state.
overrides:
  eslint: 9.39.4
  # Security floors for transitive dependencies (pnpm audit --prod). Patch/
  # minor bumps within the same major as what next / monaco-editor request.
  dompurify: ^3.4.17
  "postcss@<8.5.30": ^8.5.30
  "nanoid@>=3.0.0 <3.3.20": ^3.3.20
  "source-map-js@<1.2.2": ^1.2.2
  "browserslist@<4.29.3": ^4.29.3
  "baseline-browser-mapping@<2.11.29": ^2.11.29
  # next 15 pins sharp 0.34.x (librsvg/libvips advisories, fixed in 0.35.5).
  # sharp only backs next/image optimization; the 0.35 API used by next is unchanged.
  "sharp@<0.35.5": ^0.35.5
