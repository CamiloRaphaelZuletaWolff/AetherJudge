# Builds the executor image and the three sandbox images for linux/amd64 AND
# linux/arm64 and publishes multi-arch tags to GHCR:
#
#   ghcr.io/<owner>/aether-executor       :latest  :<short-sha>
#   ghcr.io/<owner>/aether-sandbox-cpp    :latest  :<short-sha>
#   ghcr.io/<owner>/aether-sandbox-python :latest  :<short-sha>
#   ghcr.io/<owner>/aether-sandbox-go     :latest  :<short-sha>
#
# Each architecture builds NATIVELY (ubuntu-24.04 / ubuntu-24.04-arm runners,
# free for public repositories) — no QEMU emulation, which matters for the Go
# sandbox: its GOCACHE prewarm compiles the standard library and must run on
# the target architecture (the cache is arch-specific), and under emulation
# it would take tens of minutes. The per-arch images are pushed as
# <short-sha>-<arch> tags and then merged into one manifest list.
#
# The executor VM (infra/vm/deploy.sh) pulls these; Docker picks the right
# architecture automatically (Oracle A1 = arm64, Google e2-micro = amd64).
name: Executor images

on:
  push:
    branches: [main]
    paths:
      - backend/services/executor/**
      - backend/pkg/**
      - .github/workflows/executor-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          # The executor's build context is backend/ (it COPYs pkg/ and
          # services/executor/); the sandboxes are self-contained.
          - { name: aether-executor, context: backend, file: backend/services/executor/Dockerfile }
          - { name: aether-sandbox-cpp, context: backend/services/executor/images, file: backend/services/executor/images/cpp.Dockerfile }
          - { name: aether-sandbox-python, context: backend/services/executor/images, file: backend/services/executor/images/python.Dockerfile }
          - { name: aether-sandbox-go, context: backend/services/executor/images, file: backend/services/executor/images/go.Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image names
        run: |
          # GHCR paths must be lowercase; the owner login is not.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          # Plain single-platform manifests (no attestation index), so the
          # merge step below combines exactly two images.
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}-${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

  merge:
    name: Publish ${{ matrix.name }} (multi-arch)
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [aether-executor, aether-sandbox-cpp, aether-sandbox-python, aether-sandbox-go]
    steps:
      - name: Compute image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list (latest + short SHA)
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHORT_SHA}" \
            "${IMAGE}:${SHORT_SHA}-amd64" \
            "${IMAGE}:${SHORT_SHA}-arm64"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${SHORT_SHA}"
